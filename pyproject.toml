[project]
name = "video-transcription"
version = "0.1.0"
description = "Video transcription system with Django, Whisper and Celery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.5.3",
    "django>=5.2.3",
    "djangorestframework>=3.16.0",
    "dj-database-url>=2.3.0",
    "loguru>=0.7.3",
    "openai-whisper>=20250625",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "redis>=6.2.0",
]
