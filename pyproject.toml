[project]
name = "video-transcription"
version = "0.1.0"
description = "Local app that turns speech in video or audio into subtitles, with optional AI review."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.5.3",
    "django>=5.2.3",
    "djangorestframework>=3.16.0",
    "gunicorn>=27.0.1",
    "loguru>=0.7.3",
    "openai-whisper>=20250625",
    "redis>=6.2.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "video_transcription.settings"
testpaths = ["tests"]
addopts = "-q"
# collectstatic only runs in the Docker image; tests never serve collected static files.
filterwarnings = ["ignore:No directory at.*staticfiles:UserWarning"]

[tool.coverage.run]
source = ["core", "ai_revision", "video_transcription"]
omit = ["*/migrations/*", "video_transcription/asgi.py", "video_transcription/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
